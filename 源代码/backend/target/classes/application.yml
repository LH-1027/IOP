server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iot_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT 配置
jwt:
  secret: iot-platform-jwt-secret-key-2024-esp32-mqtt-project
  expiration: 86400000

# 日志
logging:
  level:
    com.iot: DEBUG
